<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ambikaGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D1A"/>
      <stop offset="100%" stop-color="#B83200"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="256" y1="120" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#B83200" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge (No Square Box!) -->
  <circle cx="256" cy="256" r="236" fill="url(#ambikaGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Metallic Inner Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"/>

  <!-- Iconic 'AA' Monogram + Water Drop Motif -->
  <!-- Outer Water Drop Frame -->
  <path d="M256 100 C256 100 140 235 140 310 C140 374 192 416 256 416 C320 416 372 374 372 310 C372 235 256 100 256 100 Z" 
        fill="none" 
        stroke="url(#dropGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Stylized 'A' Center Apex -->
  <path d="M200 348 L256 200 L312 348" 
        fill="none" 
        stroke="url(#dropGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- 'A' Crossbar -->
  <path d="M218 304 H294" 
        fill="none" 
        stroke="url(#dropGrad)" 
        stroke-width="22" 
        stroke-linecap="round"/>

  <!-- Water Sparkle Core Dot -->
  <circle cx="256" cy="172" r="16" fill="#FFFFFF"/>
</svg>
